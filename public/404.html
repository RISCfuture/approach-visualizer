<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Page Not Found — Approach Visualizer</title>
    <meta name="description" content="There is no page at this address." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a2547" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/approach-visualizer/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/approach-visualizer/apple-touch-icon-iphone-6p.png"
    />
    <link rel="mask-icon" href="/approach-visualizer/pinned-tab.svg" color="#667eea" />

    <!-- The zone's CSP grants 'unsafe-inline' to `style-src-attr` alone, so a
         `<style>` element here would be blocked and the page would render
         unstyled. The stylesheet is a sibling file that Vite copies out of
         `public/` under a stable, unhashed name. -->
    <link rel="stylesheet" href="/approach-visualizer/404.css" />
  </head>

  <body>
    <!-- Cockpit view of a missed approach: a long spell inside the overcast,
         the decks breaking over open farmland with no runway in it, a beat to
         take that in, then the view pitching up and climbing back into cloud,
         where it started. Scenery only, so it is hidden from assistive
         technology. Each deck carries its own drift and its own stagger as
         `style` attributes, the one inline styling the CSP allows. -->
    <div class="scene" aria-hidden="true">
      <div class="windscreen">
        <div class="sky"></div>

        <div class="terrain">
          <svg class="field" viewBox="0 0 400 200" preserveAspectRatio="none" focusable="false">
            <defs>
              <linearGradient id="field-wash" x1="0" y1="0" x2="0" y2="1">
                <stop class="field-stop-far" offset="0" />
                <stop class="field-stop-near" offset="1" />
              </linearGradient>
            </defs>
            <rect width="400" height="200" fill="url(#field-wash)" />
          </svg>
          <div class="haze"></div>
        </div>
      </div>

      <div class="decks">
        <div class="fog"></div>
        <div class="deck deck-high" style="--deck-shift: -52%; --deck-delay: 0s"></div>
        <div class="deck deck-mid" style="--deck-shift: 34%; --deck-delay: 0.12s"></div>
        <div class="deck deck-low" style="--deck-shift: 68%; --deck-delay: 0.24s"></div>
      </div>
    </div>

    <main>
      <h1>
        <span class="code">404</span>
        <span class="label">Page not found</span>
      </h1>

      <p class="lede">There’s no approach charted to this address.</p>

      <p class="actions">
        <a class="button" href="/approach-visualizer/">Back to the visualizer</a>
      </p>
    </main>
  </body>
</html>
